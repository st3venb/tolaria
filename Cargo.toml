[workspace]
members = ["crates/tolaria-core", "crates/tolaria-cli", "src-tauri"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.77.2"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"
gray_matter = "0.2"
regex = "1"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
base64 = "0.22"
dirs = "5"
tempfile = "3"
log = "0.4"
futures-util = "0.3"
proptest = "1"
