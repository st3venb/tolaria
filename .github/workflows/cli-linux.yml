name: CLI Linux Builds

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: CLI (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: x86_64
          - target: aarch64-unknown-linux-musl
            arch: aarch64

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools and cross-compilation toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu
          fi

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-cargo-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            linux-cargo-${{ matrix.target }}-

      - name: Run workspace tests
        if: matrix.arch == 'x86_64'
        run: cargo test --workspace

      - name: Configure linker for aarch64
        if: matrix.arch == 'aarch64'
        run: |
          mkdir -p .cargo
          cat >> .cargo/config.toml <<'EOF'
          [target.aarch64-unknown-linux-musl]
          linker = "aarch64-linux-gnu-gcc"
          EOF

      - name: Build tolaria-cli (release)
        run: cargo build --target ${{ matrix.target }} -p tolaria-cli --release

      - name: Verify static linking
        run: |
          file target/${{ matrix.target }}/release/tolaria-cli
          file target/${{ matrix.target }}/release/tolaria-cli | grep -i "statically linked"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: tolaria-cli-${{ matrix.arch }}-linux-musl
          path: target/${{ matrix.target }}/release/tolaria-cli
          retention-days: 7
